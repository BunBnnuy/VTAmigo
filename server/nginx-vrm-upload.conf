# Owner-only VRM model uploads/downloads.
#
# Include this location block inside each VTAmigo site's `server { ... }`
# block (fast / dev / prod) and change proxy_pass to that instance's port.
#
# Why this is not the generic `location /`: VRM files can exceed 250 MB. The
# browser uploads them in 8 MB chunks (frontend/src/VRMPanel.jsx +
# backend/routes/tts.js) because Cloudflare rejects a single request body over
# its plan limit. This block disables nginx's own size check and streams the
# body to the backend instead of buffering it to disk first.
#
# `proxy_read_timeout` / `proxy_send_timeout` already come from
# snippets/vtamigo-proxy-params.conf (300s). Those are per-I/O-operation
# timeouts, not total-upload timeouts, so an 8 MB chunk on a slow upstream is
# fine as long as bytes keep flowing.
location /vrm-lab/ {
    client_max_body_size 0;
    client_body_timeout 300s;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:3003;   # fast; use 3002 for dev, 3001 for prod
    include snippets/vtamigo-proxy-params.conf;
}
