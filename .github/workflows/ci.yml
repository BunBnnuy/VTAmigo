name: Tests

on:
  push:
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        run: npm ci
        working-directory: backend

      - name: Install frontend
        run: npm ci
        working-directory: frontend

      - name: Test backend
        run: npm test
        working-directory: backend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # Fails the build on a high or critical advisory in either package, so a
      # vulnerable dependency has to be dealt with rather than noticed months
      # later. Moderate and low findings still show up in the log without
      # blocking — dev-server-only advisories shouldn't stop a deploy.
      - name: Audit backend dependencies
        run: npm audit --audit-level=high
        working-directory: backend

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend
