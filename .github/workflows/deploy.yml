name: Deploy to VPS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        # Pinned to the full commit SHA for v1.0.3 (mutable tags can be
        # re-pointed after a compromise); keep the `# v1.0.3` comment so the
        # intended version stays readable. Bump by updating both together.
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/vtamigo
            git pull origin master
            bash server/deploy-frontend.sh
