<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Top 5 del chat</title>
<style>
  :root {
    color-scheme: dark;
    --panel: rgba(14, 14, 16, 0.78);
    --border: rgba(255, 255, 255, 0.16);
    --text: #efeff1;
    --muted: #adadb8;
    --accent: #e11d76;
    --gold: #ffd75e;
  }

  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
    font-family: Nunito, "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    user-select: none;
  }

  .ranking {
    box-sizing: border-box;
    width: min(360px, 92vw);
    margin: 24px;
    padding: 16px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.38);
    backdrop-filter: blur(8px);
  }

  h1 {
    margin: 0 0 12px;
    color: var(--gold);
    font-size: 17px;
    font-weight: 800;
    letter-spacing: 0.03em;
  }

  .rows { display: grid; gap: 8px; }

  .row {
    display: grid;
    grid-template-columns: 28px minmax(0, 1fr) auto;
    align-items: center;
    gap: 8px;
    min-height: 34px;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: rgba(31, 31, 35, 0.8);
  }

  .position { color: var(--muted); font-size: 14px; font-weight: 800; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 700; }
  .stats { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 13px; }
  .hidden { display: none; }
</style>
</head>
<body>
  <section class="ranking" aria-label="Top 5 del chat">
    <h1>Top 5 del chat</h1>
    <div id="rows" class="rows" aria-live="polite"></div>
    <div id="empty" class="empty hidden">Aún no hay experiencia registrada.</div>
  </section>
<script>
  const token = new URLSearchParams(location.search).get("token") || "";
  const rowsEl = document.getElementById("rows");
  const emptyEl = document.getElementById("empty");

  function render(ranking) {
    rowsEl.replaceChildren();
    emptyEl.classList.toggle("hidden", ranking.length !== 0);
    ranking.forEach((user, index) => {
      const row = document.createElement("div");
      row.className = "row";

      const position = document.createElement("span");
      position.className = "position";
      position.textContent = "#" + (index + 1);

      const name = document.createElement("span");
      name.className = "name";
      name.textContent = user.username || "Usuario";
      name.style.color = user.color || "var(--text)";

      const stats = document.createElement("span");
      stats.className = "stats";
      stats.textContent = "Nivel " + user.level + " · " + user.xp + " XP";

      row.append(position, name, stats);
      rowsEl.appendChild(row);
    });
  }

  async function refresh() {
    try {
      const response = await fetch("/xp/ranking?limit=5&token=" + encodeURIComponent(token), { cache: "no-store" });
      if (!response.ok) return;
      const data = await response.json();
      render(Array.isArray(data.ranking) ? data.ranking.slice(0, 5) : []);
    } catch { /* retry on the next interval */ }
  }

  function connect() {
    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const socket = new WebSocket(protocol + "//" + location.host + "/chat?token=" + encodeURIComponent(token));
    socket.onmessage = (event) => {
      try {
        if (JSON.parse(event.data).type === "xp") refresh();
      } catch { /* ignore malformed messages */ }
    };
    socket.onclose = () => setTimeout(connect, 2000);
  }

  refresh();
  setInterval(refresh, 15000);
  connect();
</script>
</body>
</html>
