<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Shoutout Overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    user-select: none;
    font-family: Quicksand, Nunito, sans-serif;
  }
  /* Fades in/out via opacity (a display:none toggle can't transition). Content
     is emptied ~260ms after the fade-out so nothing lingers or makes noise. */
  #wrap {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 4vh 4vw;
    box-sizing: border-box;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #wrap.show { opacity: 1; }

  #banner {
    display: none;
    align-items: center;
    gap: 12px;
    padding: 14px 26px;
    border-radius: 14px;
    background: rgba(14, 14, 16, 0.82);
    border: 2px solid #9147ff;
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    color: #efeff1;
    font-size: clamp(22px, 3vw, 42px);
    font-weight: 700;
    text-align: center;
    max-width: 90vw;
  }
  #banner .star { color: #e11d76; flex-shrink: 0; }

  #clip-box {
    width: min(72vw, 1100px);
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
  }
  /* Native clip video (preferred) or the Twitch iframe fallback. Neither gets
     the Twitch player chrome: the video element is ours, and if it fails to
     load we only fall back to the iframe rather than showing nothing. */
  #clip-box video, #clip-box iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #000;
    animation: pop 0.3s ease-out;
  }
  #clip-box video { object-fit: contain; }

  @keyframes pop {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
  <div id="wrap">
    <div id="banner"><span class="star">★</span><span id="banner-text"></span></div>
    <div id="clip-box"></div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get("token") || "";

  const wrap = document.getElementById("wrap");
  const banner = document.getElementById("banner");
  const bannerText = document.getElementById("banner-text");
  const clipBox = document.getElementById("clip-box");

  let hideTimer = null;
  let clearTimer = null;

  // Twitch's clip iframe is non-interactive (no JS API, un-hideable chrome),
  // so it's only a fallback: the MP4 Twitch serves for the clip plays in a
  // plain <video> we fully control.
  function iframeFallback(clip) {
    const parent = encodeURIComponent(location.hostname || "localhost");
    const frame = document.createElement("iframe");
    frame.setAttribute("allowfullscreen", "true");
    frame.setAttribute("allow", "autoplay; fullscreen");
    frame.src = `https://clips.twitch.tv/embed?clip=${encodeURIComponent(clip.slug)}&parent=${parent}&autoplay=true&muted=false`;
    clipBox.replaceChildren(frame);
  }

  // Returns "video" or "iframe" so show() knows whether to trust the element's
  // own `ended` event or lean on the endsAt timer.
  function buildMedia(data) {
    const clip = data.clip;
    if (clip.mp4Url) {
      const video = document.createElement("video");
      video.src = clip.mp4Url;
      video.autoplay = true;
      video.playsInline = true;
      video.preload = "auto";
      video.volume = 1;
      video.muted = false;
      video.addEventListener("ended", hide, { once: true });
      video.addEventListener("error", () => iframeFallback(clip), { once: true });
      // Resume where a reloaded Browser Source left off, mid-clip.
      const elapsed = Math.max(0, (Date.now() - (data.startedAt || Date.now())) / 1000);
      video.addEventListener("loadedmetadata", () => {
        const dur = video.duration || 0;
        if (elapsed > 0.5 && (!dur || elapsed < dur - 0.5)) video.currentTime = elapsed;
      }, { once: true });
      clipBox.replaceChildren(video);
      const started = video.play();
      if (started && typeof started.catch === "function") {
        started.catch(() => {
          // Unmuted autoplay was blocked: start muted so the clip still plays,
          // then unmute as soon as it's actually playing.
          video.muted = true;
          video.play().catch(() => {});
          video.addEventListener("playing", () => { video.muted = false; }, { once: true });
        });
      }
      return "video";
    }
    iframeFallback(clip);
    return "iframe";
  }

  function clearMedia() {
    const video = clipBox.querySelector("video");
    if (video) {
      try { video.pause(); video.removeAttribute("src"); video.load(); } catch {}
    }
    clipBox.replaceChildren();
  }

  function hide() {
    clearTimeout(hideTimer);
    hideTimer = null;
    wrap.classList.remove("show");
    clearTimeout(clearTimer);
    clearTimer = setTimeout(() => {
      if (!wrap.classList.contains("show")) {
        clearMedia();
        banner.style.display = "none";
        bannerText.textContent = "";
      }
    }, 260);
  }

  function show(data) {
    const remainingMs = data.endsAt - Date.now();
    if (!data.clip || (!data.clip.mp4Url && !data.clip.slug) || remainingMs <= 0) {
      hide();
      return;
    }
    clearTimeout(hideTimer);
    clearTimeout(clearTimer);
    bannerText.textContent = data.bannerText || "";
    banner.style.display = data.showBanner === false ? "none" : "inline-flex";
    clearMedia();
    const kind = buildMedia(data);
    wrap.classList.add("show");
    // The native <video> fires `ended` at the exact moment (that's the fast
    // fade-out), so its timer is only a coarse safety net. The iframe fallback
    // has no ended event at all, so for it the endsAt timer is the real one.
    hideTimer = setTimeout(hide, kind === "video" ? remainingMs + 20000 : remainingMs);
  }

  // Resume if OBS reloads the source while a clip is still playing.
  fetch(`/shoutout/state?token=${encodeURIComponent(token)}`)
    .then((r) => r.json())
    .then((data) => { if (data && data.shoutout) show(data.shoutout); })
    .catch(() => {});

  function connect() {
    const wsProtocol = location.protocol === "https:" ? "wss://" : "ws://";
    const ws = new WebSocket(wsProtocol + location.host + "/chat?token=" + encodeURIComponent(token));
    ws.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch { return; }
      if (data.type === "shoutout") show(data);
    };
    ws.onclose = () => setTimeout(connect, 2000);
  }
  connect();
</script>
</body>
</html>
