<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Video Overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    user-select: none;
    font-family: sans-serif;
  }
  #wrap {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    /* End-anchored so the bar sits at the bottom whether or not the video
       (which flexes to fill the rest) is visible. */
    justify-content: flex-end;
  }
  #wrap.show { display: flex; }
  #player-box {
    flex: 1;
    position: relative;
  }
  #player-box iframe, #player-box > div {
    width: 100%;
    height: 100%;
  }
  /* Builder-only mock frame drawn over the (empty) player. */
  #video-sample { position: absolute; inset: 0; z-index: 2; }
  #video-sample img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #bar-track {
    position: relative;
    height: 64px;
    flex-shrink: 0;
    background: rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }
  #bar-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    background: rgba(145, 71, 255, 0.55);
    transition: width 0.25s linear;
  }
  #bar-content {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 18px;
    box-sizing: border-box;
  }
  #bar-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
  }
  #bar-time {
    flex-shrink: 0;
    color: #fff;
    font-size: 20px;
    font-weight: 600;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85);
  }
</style>
</head>
<body>
  <div id="wrap">
    <div id="player-box">
      <div id="yt-player"></div>
      <div id="video-sample" hidden></div>
    </div>
    <div id="bar-track">
      <div id="bar-fill"></div>
      <div id="bar-content">
        <span id="bar-title"></span>
        <span id="bar-time"></span>
      </div>
    </div>
  </div>

<script src="/overlay/preview-note.js?v=2"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
  const params = new URLSearchParams(location.search);
  const token = params.get("token") || "";

  const wrap = document.getElementById("wrap");
  const barFill = document.getElementById("bar-fill");
  const barTitle = document.getElementById("bar-title");
  const barTime = document.getElementById("bar-time");
  const sampleEl = document.getElementById("video-sample");

  // Builder preview: mock poster + a populated title bar, drawn over the blank
  // YouTube player. Cleared when a real video loads.
  function showVideoSample() {
    if (!window.OverlayPreviewNote || !OverlayPreviewNote.badge || !OverlayPreviewNote.posterDataUrl) return;
    OverlayPreviewNote.badge();
    const img = document.createElement("img");
    img.src = OverlayPreviewNote.posterDataUrl("Sample song");
    img.alt = "";
    sampleEl.replaceChildren(img);
    sampleEl.hidden = false;
    barTitle.textContent = "Sample Song — Sample Artist";
    barTime.textContent = "3:24";
    barFill.style.width = "38%";
    wrap.classList.add("show");
  }

  let player = null;
  let playerReady = false;
  let currentVideoId = null;
  let pendingOffsetSec = 0;
  let pendingPaused = false;
  let pendingTitle = "";
  let progressTimer = null;

  function fmtTime(sec) {
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${m}:${String(s).padStart(2, "0")}`;
  }

  function stopProgress() {
    clearInterval(progressTimer);
    progressTimer = null;
  }

  function startProgress() {
    stopProgress();
    progressTimer = setInterval(() => {
      if (!playerReady || !player.getDuration) return;
      const duration = player.getDuration();
      const current = player.getCurrentTime();
      if (!duration) return;
      barFill.style.width = `${Math.min(100, (current / duration) * 100)}%`;
      barTime.textContent = fmtTime(duration - current);
    }, 500);
  }

  function reportEnded(videoId) {
    fetch(`/video/ended?token=${encodeURIComponent(token)}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ videoId }),
    }).catch(() => {});
  }

  function onPlayerStateChange(e) {
    if (e.data === YT.PlayerState.ENDED && currentVideoId) {
      stopProgress();
      reportEnded(currentVideoId);
    } else if (e.data === YT.PlayerState.PLAYING) {
      startProgress();
    }
  }

  function onPlayerReady() {
    playerReady = true;
    if (currentVideoId) loadVideo(currentVideoId, pendingOffsetSec, pendingPaused, pendingTitle);
  }

  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("yt-player", {
      width: "100%",
      height: "100%",
      playerVars: { autoplay: 1, controls: 0, disablekb: 1, modestbranding: 1, rel: 0 },
      events: { onReady: onPlayerReady, onStateChange: onPlayerStateChange },
    });
  };

  function loadVideo(videoId, offsetSec, paused, title) {
    currentVideoId = videoId;
    barTitle.textContent = title || "";
    if (!playerReady) {
      pendingOffsetSec = offsetSec || 0;
      pendingPaused = !!paused;
      pendingTitle = title || "";
      return;
    }
    wrap.classList.add("show");
    sampleEl.hidden = true;
    player.loadVideoById({ videoId, startSeconds: offsetSec || 0 });
    if (paused) setTimeout(() => player.pauseVideo(), 400);
  }

  function clearVideo() {
    currentVideoId = null;
    stopProgress();
    barFill.style.width = "0%";
    barTitle.textContent = "";
    barTime.textContent = "";
    wrap.classList.remove("show");
    if (window.OverlayPreviewNote) showVideoSample();
    if (playerReady) player.stopVideo();
  }

  // Video and progress bar can each be hidden independently (Video Queue
  // panel toggles). Both default on when a state predates the settings.
  function applyVisibility(state) {
    document.getElementById("player-box").hidden = state.showVideo === false;
    document.getElementById("bar-track").hidden = state.showProgressBar === false;
  }

  function applyState(state) {
    applyVisibility(state);
    const nowPlaying = state.nowPlaying;
    if (!nowPlaying) {
      clearVideo();
      return;
    }
    if (nowPlaying.videoId !== currentVideoId) {
      loadVideo(nowPlaying.videoId, 0, nowPlaying.paused, nowPlaying.title);
    } else if (playerReady) {
      if (nowPlaying.paused) player.pauseVideo();
      else player.playVideo();
    }
  }

  // Initial state fetch — resumes mid-song (and respects a paused state) if
  // OBS reloads the overlay.
  fetch(`/video/state?token=${encodeURIComponent(token)}`)
    .then((r) => r.json())
    .then((state) => {
      applyVisibility(state);
      const nowPlaying = state.nowPlaying;
      if (nowPlaying) {
        const offset = Math.max(0, Math.floor((Date.now() - nowPlaying.startedAt) / 1000));
        loadVideo(nowPlaying.videoId, offset, nowPlaying.paused, nowPlaying.title);
      }
    })
    .catch(() => {});

  function connect() {
    const wsProtocol = location.protocol === "https:" ? "wss://" : "ws://";
    const ws = new WebSocket(wsProtocol + location.host + "/chat?token=" + encodeURIComponent(token));
    ws.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch { return; }
      if (data.type === "video_state") applyState(data);
    };
    ws.onclose = () => setTimeout(connect, 2000);
  }
  showVideoSample();
  connect();
</script>
</body>
</html>
