<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Chat Overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    font-family: var(--fontfamily, "Segoe UI", system-ui, sans-serif);
    user-select: none;
  }

  #feed {
    position: fixed;
    left: 1.2vw;
    bottom: 1.2vh;
    width: var(--width, 420px);
    max-height: min(var(--maxheight, 600px), 96vh);
    display: flex;
    flex-direction: column-reverse; /* newest at bottom by default (direction=up) */
    gap: 6px;
  }
  #feed.dir-down {
    flex-direction: column;
    top: 1.2vh;
    bottom: auto;
  }
  #feed.align-right {
    left: auto;
    right: 1.2vw;
  }

  .row {
    position: relative;
    z-index: 0; /* stacking context so .row-bg (z-index:-1) stays behind this row only */
    overflow: hidden; /* clips .row-bg to the row's rounded corners */
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(0, 0, 0, var(--bg, 0.35));
    box-shadow: 0 1px 4px rgba(0,0,0,0.35);
    font-size: var(--fontsize, 16px);
    line-height: 1.35;
    color: var(--textcolor, #fff);
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    word-break: break-word;
    opacity: 1;
    transition: opacity 0.5s ease, transform 0.3s ease;
  }
  .row-bg {
    position: absolute;
    inset: 0;
    z-index: -1;
    pointer-events: none;
  }
  .row.animate-in {
    animation: slideIn 0.25s ease-out;
  }
  .row.fade-out {
    opacity: 0;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .row-head {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .row-user {
    font-weight: 700;
  }
  .row-time {
    font-size: 0.75em;
    opacity: 0.6;
    font-weight: 400;
  }
  .row-text {
    white-space: pre-wrap;
  }

  /* Redemptions + Twitch events get a distinct highlighted style */
  .row.event {
    background: rgba(145, 71, 255, var(--bg-event, 0.55));
    border: 1px solid rgba(255, 255, 255, 0.25);
  }
  .row.event .row-user { color: #ffd75e; }
  .row.event .row-icon { margin-right: 4px; }

  /* When a nine-slice background image is set, it replaces the flat
     tinted background entirely instead of showing through/under it. */
  .row.bg-image-active {
    background: transparent;
    box-shadow: none;
  }
  .row.bg-image-active.event {
    border: none;
  }

  /* ── Banner: big centered alert for a single event, auto-dismisses ────── */
  #banner {
    position: fixed;
    top: 5vh;
    left: 50%;
    transform: translateX(-50%) translateY(-16px) scale(0.92);
    min-width: 280px;
    max-width: 80vw;
    padding: 16px 28px;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(145,71,255,0.92), rgba(88,28,180,0.92));
    border: 2px solid rgba(255,255,255,0.35);
    box-shadow: 0 6px 24px rgba(0,0,0,0.5);
    text-align: center;
    color: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  #banner.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
  #banner .b-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #ffd75e;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  #banner .b-body {
    margin-top: 4px;
    font-size: 24px;
    font-weight: 800;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  #banner .b-sub {
    margin-top: 2px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0.9;
  }

  /* ══ "bubbles" theme ══════════════════════════════════════════════════════
     Decorated speech bubbles with flower ornaments and a role-badge tag.
     Entirely separate from the .row renderer above: different DOM (.box /
     .message-box), different scroll model (per-row margin-bottom animation
     rather than flex gap), different DOM order (newest first, since the
     scroll animation always operates on the newest element). Only the feed
     container, the WS plumbing and the behavior knobs are shared.

     The layout, ornament geometry and keyframes are ported from the
     StreamElements "Chat Widget" by Wasabi Studio; the custom-property names
     are kept identical to the original so its saved themes map over 1:1. */

  #feed.theme-bubbles {
    gap: 0;
    padding: 0 20px 0 30px;
    overflow: hidden;
    /* Decorations overflow the bubble box by up to ~20px, so the feed needs
       its own padding to keep them from being clipped at the edges. */
  }
  #feed.theme-bubbles * {
    margin: 0;
    padding: 0;
    overflow-wrap: break-word;
  }

  #feed.theme-bubbles .box {
    animation: slide-in-left-2 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  #feed.theme-bubbles.no-animate .box,
  #feed.theme-bubbles.no-animate .box * {
    animation: none !important;
  }
  /* Ornaments off: everything decorative around the bubble goes, leaving a
     plain rounded speech bubble. Done in CSS rather than by skipping the
     nodes so the toggle applies to rows already on screen. The role badge
     tag is deliberately excluded — that's its own `showBadges` setting. */
  #feed.theme-bubbles.no-decorations .flower-t-l,
  #feed.theme-bubbles.no-decorations .flower-b-r,
  #feed.theme-bubbles.no-decorations .flower-inset-l,
  #feed.theme-bubbles.no-decorations .flower-inset-r,
  #feed.theme-bubbles.no-decorations .vector-t,
  #feed.theme-bubbles.no-decorations .vector-b,
  #feed.theme-bubbles.no-decorations .badge-content,
  #feed.theme-bubbles.no-decorations .alert-svg-1,
  #feed.theme-bubbles.no-decorations .alert-svg-2 {
    display: none;
  }
  @keyframes slide-in-left-2 {
    0%   { transform: translateY(500px) scale(0.3); opacity: 0; }
    90%  { transform: translateY(0) scale(1.03); opacity: 1; }
    100% { transform: scale(1); }
  }

  #feed.theme-bubbles .message-box {
    display: flex;
    position: relative;
    margin-right: 5px;
    margin-left: 20px;
  }

  #feed.theme-bubbles .emote-normal-size {
    margin-top: -5px;
    position: relative;
    bottom: -3px;
    width: auto;
    height: var(--message-font-size);
  }
  #feed.theme-bubbles .emote-big-size,
  #feed.theme-bubbles .emote-only img {
    position: relative;
    bottom: -5px;
    width: auto;
    height: 38px;
  }
  /* Twitch badge images, when the theme is set to show real art instead of
     the built-in icons. */
  #feed.theme-bubbles .badge-img {
    height: calc(var(--username-font-size) * 0.75);
    width: auto;
    position: relative;
    top: 1px;
  }

  #feed.theme-bubbles .message-content-box {
    max-width: 100%;
    min-width: 100%;
    position: relative;
    z-index: 120;
  }
  #feed.theme-bubbles .content-box-border { position: relative; z-index: 100; }
  #feed.theme-bubbles .content-box {
    border: 2px solid var(--message-border);
    background: var(--message-background);
    padding: 7px 27px;
    position: relative;
    border-radius: 20px;
    display: flex;
    max-width: 100%;
    overflow: hidden;
    z-index: 90;
  }
  #feed.theme-bubbles .content {
    font-family: var(--font-family-secondary);
    max-width: 100%;
    color: var(--message-color);
    font-size: var(--message-font-size);
    font-weight: var(--message-font-weight);
    letter-spacing: -0.6px;
    z-index: 100;
    white-space: pre-wrap;
  }
  #feed.theme-bubbles .content.action { font-style: italic; }

  #feed.theme-bubbles .message-header {
    z-index: 10;
    margin-left: 25px;
    margin-bottom: 5px;
  }
  #feed.theme-bubbles .message-username-box {
    display: flex;
    align-items: center;
    position: relative;
    gap: 5px;
  }
  #feed.theme-bubbles .username {
    font-size: var(--username-font-size);
    color: var(--username-color);
    font-family: var(--font-family-primary);
    font-weight: var(--username-font-weight);
    letter-spacing: -0.6px;
    text-transform: lowercase;
    animation: fadeIn 0.5s ease both 0.5s;
  }
  #feed.theme-bubbles .badge-content { position: relative; z-index: 10; }
  #feed.theme-bubbles .badge-content > svg {
    position: relative;
    top: 2px;
    z-index: 100;
    animation: grow-ear 0.5s ease both 0.5s;
    transform-origin: 50% 50%;
  }

  #feed.theme-bubbles .flower-t-l { position: absolute; top: -15px; left: -15px; z-index: 100; }
  #feed.theme-bubbles .flower-t-l-group1 { animation: grow-ear 0.5s ease both 0.5s; transform-origin: 40% 70%; }
  #feed.theme-bubbles .flower-t-l-group2 { animation: grow-ear 0.5s ease both 0.4s; transform-origin: 40% 70%; }
  #feed.theme-bubbles .flower-t-l-group1-leaf { --init: 0; --end: 1; animation: move-flower 0.5s ease both 0.6s; transform-origin: 40% 70%; }

  #feed.theme-bubbles .flower-b-r { position: absolute; bottom: -18px; right: -9px; z-index: 100; }
  #feed.theme-bubbles .flower-b-r-group1 { animation: grow-ear 0.5s ease both 0.5s; transform-origin: 80% 10%; }
  #feed.theme-bubbles .flower-b-r-group1-leaf { --init: 0; --end: 1; animation: move-flower 0.5s ease both 0.6s; transform-origin: 80% 10%; }
  #feed.theme-bubbles .flower-b-r-group2 { animation: grow-ear 0.5s ease both 0.7s; transform-origin: 20% 80%; }
  #feed.theme-bubbles .flower-b-r-group2-leaf { --init: 0; --end: 1; animation: move-flower 0.5s ease both 0.78s; transform-origin: 20% 80%; }
  #feed.theme-bubbles .flower-b-r-group3 { animation: grow-ear 0.5s ease both 0.6s; transform-origin: 60% 60%; }

  #feed.theme-bubbles .vector-b {
    position: absolute; bottom: -9px; left: 120px; z-index: 100;
    animation: grow-ear 0.5s ease both 0.8s; transform-origin: 50% 50%;
  }
  #feed.theme-bubbles .vector-t {
    position: absolute; top: -12px; right: 100px; z-index: 100;
    animation: grow-ear 0.5s ease both 0.9s; transform-origin: 50% 50%;
  }
  #feed.theme-bubbles .flower-inset-l {
    position: absolute; bottom: -45px; left: -16px;
    animation: spin-circle 14s linear infinite; transform-origin: 50% 50%;
  }
  #feed.theme-bubbles .flower-inset-r { position: absolute; top: -15px; right: -5px; }
  #feed.theme-bubbles .flower-inset-r-group1 { animation: fadeIn2 0.5s ease both 0.6s; }
  #feed.theme-bubbles .flower-inset-r-group2 { animation: fadeIn2 0.5s ease both 0.8s; }

  #feed.theme-bubbles .badge-container {
    --init: -20px; --end: 0px;
    position: absolute; bottom: -26px; left: 30px;
    animation: moveY 0.5s ease both 0.5s; transform-origin: 50% 50%;
  }
  #feed.theme-bubbles .badge-svg-icon {
    position: absolute; bottom: -17px; left: 36px;
    animation: grow-ear 0.5s ease both 0.7s; transform-origin: 50% 50%;
  }

  /* Alerts (follows, subs, raids, cheers, redemptions) */
  #feed.theme-bubbles .alert-box { max-width: 100%; display: flex; justify-content: center; }
  #feed.theme-bubbles .alert-box-main { max-width: 100%; position: relative; display: flex; justify-content: center; }
  #feed.theme-bubbles .alert-content-box {
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 10; max-width: 100%; min-width: inherit;
  }
  #feed.theme-bubbles .alert-svg-1 {
    position: absolute; left: -20px; top: calc(50% + 2px); transform: translateY(-50%);
    animation: grow-ear-alert 0.5s ease both 0.3s; transform-origin: 100% 0%;
  }
  #feed.theme-bubbles .alert-svg-2 {
    position: absolute; right: -20px; top: calc(50% + 2px); transform: translateY(-50%);
    animation: grow-ear-alert 0.5s ease both 0.3s; transform-origin: 100% 0%;
  }
  #feed.theme-bubbles .alert-content { max-width: 100%; min-width: 60%; z-index: 10; }
  #feed.theme-bubbles .alert-title { display: flex; align-items: center; justify-content: center; position: relative; }
  #feed.theme-bubbles .alert-username {
    font-family: var(--font-family-secondary);
    font-size: var(--alert-username-font-size);
    color: var(--alert-username-color);
    font-weight: var(--alert-username-font-weight);
    letter-spacing: -0.6px;
    text-transform: lowercase;
    animation: fadeIn 0.5s ease both 0.5s;
    text-align: center;
  }

  #feed.theme-bubbles .box-transition { transition: margin-bottom 0.9s; }

  @keyframes move-flower {
    0%   { transform: scale(var(--init)); filter: opacity(0); }
    100% { transform: scale(var(--end)); filter: opacity(1); }
  }
  @keyframes moveY {
    0%   { transform: translateY(var(--init)); filter: opacity(0); }
    100% { transform: translateY(var(--end)); filter: opacity(1); }
  }
  @keyframes spin-circle {
    0%   { transform: rotate(360deg); }
    100% { transform: rotate(-360deg); }
  }
  @keyframes fadeIn  { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes fadeIn2 { 0% { opacity: 0; } 100% { opacity: 0.2; } }
  @keyframes grow-ear {
    0%   { transform: scale(0);   filter: opacity(0); }
    80%  { transform: scale(1.1); filter: opacity(1); }
    100% { transform: scale(1);   filter: opacity(1); }
  }
  @keyframes grow-ear-alert {
    0%   { transform: scale(0)   translateY(-50%); filter: opacity(0); }
    60%  { transform: scale(1.2) translateY(-50%); filter: opacity(1); }
    100% { transform: scale(1)   translateY(-50%); filter: opacity(1); }
  }
</style>
</head>
<body>
  <div id="feed"></div>
  <div id="banner">
    <div class="b-title" id="b-title"></div>
    <div class="b-body" id="b-body"></div>
    <div class="b-sub" id="b-sub"></div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get("token") || "";

  // Behavior/appearance is server-driven (see backend/chatOverlayConfig.js),
  // edited live from the ChatOverlayPanel side panel in the app. Loaded once
  // on open, then kept in sync over the same /chat WS via
  // { type: "chat_overlay_config" } pushes — no reload needed in OBS when
  // the streamer changes a setting.
  const DEFAULTS = {
    theme: "default",
    max: 25, fade: 0, showEvents: true, showBanner: true, bannerDuration: 6000,
    showRedeems: true, showBotMessages: true, direction: "up", align: "left",
    timestamps: false, userColor: true, animate: true, lang: "en", width: 420,
    maxHeight: 600, fontsize: 16, bg: 0.35, textcolor: "ffffff", fontFamily: "",
    bgImageOpacity: 1, sliceLeft: 24, sliceRight: 24, sliceTop: 24, sliceBottom: 24,
    mirrorH: false, mirrorV: false, hasBgImage: false,
    // bubbles theme (see backend/chatOverlayConfig.js for the authoritative list)
    allCaps: false, showBadges: true, showDecorations: true, ignoreCommands: "",
    fontSizeUsername: 24, fontWeightUsername: 400,
    fontSizeMessage: 20, fontWeightMessage: 400,
    fontSizeAlertUsername: 19, fontWeightAlertUsername: 400,
    usernameColor: "#F7FBFF", messageBackground: "#F7FBFF", messageBorder: "#EEB09E",
    messageColor: "#DB867A", alertColor: "#F7FBFF",
    flowerBorder: "#EEB09E", flowerFill: "#FCFEFF", flowerCenter: "#FBD5B5",
    flowerLeaf: "#92AF3E", flower2Leaf: "#92AF3E", flower2Fill: "#EEB09E",
    followAlertMessage: "just followed!",
    subAlertMessage: "just subscribed!",
    resubAlertMessage: "resubscribed for [amount] months!",
    giftedSubAlertMessage: "just gifted x[amount]!",
    cheerAlertMessage: "just cheered [amount] bits!",
    raidAlertMessage: "just raided with [amount]!",
    redeemAlertMessage: "redeemed [amount]!",
  };
  let cfg = { ...DEFAULTS };

  const feedEl = document.getElementById("feed");
  const bannerEl = document.getElementById("banner");

  function applyConfig(newCfg) {
    const prevHasBgImage = cfg.hasBgImage;
    const prevTheme = cfg.theme;
    cfg = { ...DEFAULTS, ...newCfg };
    const root = document.documentElement.style;
    root.setProperty("--width", cfg.width + "px");
    root.setProperty("--maxheight", cfg.maxHeight + "px");
    root.setProperty("--fontsize", cfg.fontsize + "px");
    root.setProperty("--bg", String(cfg.bg));
    root.setProperty("--textcolor", "#" + String(cfg.textcolor || "ffffff").replace(/^#/, ""));
    root.setProperty("--fontfamily", cfg.fontFamily ? `"${cfg.fontFamily.replace(/"/g, "")}"` : "");
    feedEl.classList.toggle("dir-down", cfg.direction === "down");
    feedEl.classList.toggle("align-right", cfg.align === "right");
    applyBubbleConfig(prevTheme);
    trimFeed();
    // The image (if any) replaces the flat tinted row background entirely.
    feedEl.querySelectorAll(".row").forEach((r) => r.classList.toggle("bg-image-active", cfg.hasBgImage));
    if (cfg.hasBgImage !== prevHasBgImage) loadBgImage();
    else redrawAllRowBgs();
  }

  async function loadConfig() {
    try {
      const res = await fetch("/chat-overlay/config?token=" + encodeURIComponent(token));
      const data = await res.json();
      applyConfig(data.config || {});
    } catch {
      applyConfig(DEFAULTS);
    }
  }
  loadConfig();

  // ── Nine-slice background texture, applied per message row ─────────────────
  // One shared source image; each row gets its own canvas sized to that
  // row's own (dynamic, content-dependent) box, redrawn whenever the row
  // resizes — e.g. font size changes, width changes, or text wraps.
  let bgImg = null;

  function drawPiece(ctx, img, sx, sy, sw, sh, dx, dy, dw, dh, flipX, flipY) {
    if (sw <= 0 || sh <= 0 || dw <= 0 || dh <= 0) return;
    ctx.save();
    ctx.translate(dx + (flipX ? dw : 0), dy + (flipY ? dh : 0));
    ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
    ctx.drawImage(img, sx, sy, sw, sh, 0, 0, dw, dh);
    ctx.restore();
  }

  function redrawRowBg(rowEl) {
    const canvas = rowEl && rowEl.querySelector(".row-bg");
    if (!canvas) return;
    const w = Math.max(1, Math.round(rowEl.clientWidth));
    const h = Math.max(1, Math.round(rowEl.clientHeight));
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, w, h);
    if (!bgImg) return;

    const iw = bgImg.naturalWidth, ih = bgImg.naturalHeight;
    if (!iw || !ih) return;
    // Slice insets are native px of the SOURCE image — classic nine-slice,
    // corners render at their natural size. Clamped first to the image's
    // own bounds, then (if a row is too small to fit both corners on an
    // axis) shrunk together proportionally for BOTH the source crop and the
    // destination placement — never just the destination, which is what
    // caused the earlier "flying saucer" distortion (a full-size corner
    // squeezed into a tiny box while its opposite corner ate the rest).
    let L = Math.min(cfg.sliceLeft, iw);
    let T = Math.min(cfg.sliceTop, ih);
    let R = cfg.mirrorH ? L : Math.min(cfg.sliceRight, iw);
    let B = cfg.mirrorV ? T : Math.min(cfg.sliceBottom, ih);
    if (L + R > iw) { const s = iw / (L + R); L *= s; R *= s; }
    if (T + B > ih) { const s = ih / (T + B); T *= s; B *= s; }

    let dL = L, dR = R, dT = T, dB = B;
    if (dL + dR > w) { const s = w / (dL + dR); dL *= s; dR *= s; }
    if (dT + dB > h) { const s = h / (dT + dB); dT *= s; dB *= s; }

    const sx = [0, L, iw - R, iw];
    const sy = [0, T, ih - B, ih];
    const dx = [0, dL, w - dR, w];
    const dy = [0, dT, h - dB, h];

    ctx.globalAlpha = cfg.bgImageOpacity;
    for (let row = 0; row < 3; row++) {
      for (let col = 0; col < 3; col++) {
        const flipX = cfg.mirrorH && col === 2;
        const flipY = cfg.mirrorV && row === 2;
        const srcCol = flipX ? 0 : col; // mirrored right column reuses the left column's source
        const srcRow = flipY ? 0 : row; // mirrored bottom row reuses the top row's source
        const sX = sx[srcCol], sY = sy[srcRow];
        const sW = sx[srcCol + 1] - sx[srcCol];
        const sH = sy[srcRow + 1] - sy[srcRow];
        const dX = dx[col], dY = dy[row];
        const dW = dx[col + 1] - dx[col];
        const dH = dy[row + 1] - dy[row];
        drawPiece(ctx, bgImg, sX, sY, sW, sH, dX, dY, dW, dH, flipX, flipY);
      }
    }
    ctx.globalAlpha = 1;
  }

  function redrawAllRowBgs() {
    feedEl.querySelectorAll(".row").forEach(redrawRowBg);
  }

  function loadBgImage() {
    if (!cfg.hasBgImage) {
      bgImg = null;
      redrawAllRowBgs();
      return;
    }
    const img = new Image();
    img.onload = () => { bgImg = img; redrawAllRowBgs(); };
    img.onerror = () => { bgImg = null; redrawAllRowBgs(); };
    img.src = "/chat-overlay/bg-image?token=" + encodeURIComponent(token) + "&t=" + Date.now();
  }

  const rowResizeObserver = typeof ResizeObserver !== "undefined"
    ? new ResizeObserver((entries) => { for (const entry of entries) redrawRowBg(entry.target); })
    : null;

  const bTitleEl = document.getElementById("b-title");
  const bBodyEl = document.getElementById("b-body");
  const bSubEl = document.getElementById("b-sub");

  // ── i18n for event copy ───────────────────────────────────────────────────
  const STR = {
    en: {
      follow: (u) => [`New Follower`, u, ``],
      sub: (u, ev) => [ev.isGift ? `Gift Sub` : `New Sub`, u, ev.tier ? tierLabel(ev.tier) : ``],
      resub: (u, ev) => [`Resub`, u, `${ev.months} month${ev.months === 1 ? "" : "s"}${ev.message ? ` — "${ev.message}"` : ""}`],
      giftsub: (u, ev) => [`Gift Subs`, ev.isAnonymous ? "Anonymous" : u, `gifted ${ev.count} sub${ev.count === 1 ? "" : "s"}`],
      raid: (u, ev) => [`Raid`, u, `${ev.viewers} viewer${ev.viewers === 1 ? "" : "s"}`],
      cheer: (u, ev) => [`Cheer`, u, `${ev.bits} bits${ev.message ? ` — "${ev.message}"` : ""}`],
      redeem: (u, ev) => [`Redemption`, u, ev.rewardTitle || ""],
    },
    es: {
      follow: (u) => [`Nuevo Seguidor`, u, ``],
      sub: (u, ev) => [ev.isGift ? `Sub Regalada` : `Nueva Sub`, u, ev.tier ? tierLabel(ev.tier) : ``],
      resub: (u, ev) => [`Resub`, u, `${ev.months} mes${ev.months === 1 ? "" : "es"}${ev.message ? ` — "${ev.message}"` : ""}`],
      giftsub: (u, ev) => [`Subs Regaladas`, ev.isAnonymous ? "Anónimo" : u, `regaló ${ev.count} sub${ev.count === 1 ? "" : "s"}`],
      raid: (u, ev) => [`Raid`, u, `${ev.viewers} espectador${ev.viewers === 1 ? "" : "es"}`],
      cheer: (u, ev) => [`Cheer`, u, `${ev.bits} bits${ev.message ? ` — "${ev.message}"` : ""}`],
      redeem: (u, ev) => [`Canje`, u, ev.rewardTitle || ""],
    },
  };
  function tierLabel(tier) {
    return tier === "2000" ? "Tier 2" : tier === "3000" ? "Tier 3" : "Tier 1";
  }
  function eventCopy(kind, username, ev) {
    const dict = STR[cfg.lang];
    const fn = dict[kind];
    if (!fn) return [kind, username, ""];
    return fn(username, ev);
  }

  // ── Chat feed rendering ───────────────────────────────────────────────────
  function fmtTime(ts) {
    const d = new Date(ts || Date.now());
    return d.toLocaleTimeString(cfg.lang === "es" ? "es-ES" : "en-US", { hour: "2-digit", minute: "2-digit" });
  }

  function addRow({ username, color, text, isEvent, timestamp, iconLabel }) {
    const row = document.createElement("div");
    row.className = "row" + (isEvent ? " event" : "") + (cfg.animate ? " animate-in" : "") + (cfg.hasBgImage ? " bg-image-active" : "");

    const bgCanvas = document.createElement("canvas");
    bgCanvas.className = "row-bg";
    row.appendChild(bgCanvas);

    const head = document.createElement("div");
    head.className = "row-head";
    if (iconLabel) {
      const icon = document.createElement("span");
      icon.className = "row-icon";
      icon.textContent = iconLabel;
      head.appendChild(icon);
    }
    const userEl = document.createElement("span");
    userEl.className = "row-user";
    userEl.textContent = username;
    if (cfg.userColor && color) userEl.style.color = color;
    head.appendChild(userEl);
    if (cfg.timestamps) {
      const timeEl = document.createElement("span");
      timeEl.className = "row-time";
      timeEl.textContent = fmtTime(timestamp);
      head.appendChild(timeEl);
    }
    row.appendChild(head);

    if (text) {
      const textEl = document.createElement("div");
      textEl.className = "row-text";
      textEl.textContent = text;
      row.appendChild(textEl);
    }

    feedEl.appendChild(row);
    redrawRowBg(row);
    if (rowResizeObserver) rowResizeObserver.observe(row);
    trimFeed();

    if (cfg.fade > 0) {
      setTimeout(() => {
        row.classList.add("fade-out");
        setTimeout(() => removeRow(row), 550);
      }, cfg.fade * 1000);
    }
  }

  function removeRow(rowEl) {
    if (rowResizeObserver) rowResizeObserver.unobserve(rowEl);
    rowEl.remove();
  }

  function trimFeed() {
    if (cfg.theme === "bubbles") {
      // The bubbles theme stacks newest-first, so the oldest box is last.
      let boxes = feedEl.querySelectorAll(".box");
      for (let i = boxes.length - 1; i >= cfg.max; i--) boxes[i].remove();
      return;
    }
    // column-reverse (direction=up) keeps DOM order oldest->newest, so the
    // oldest row is the first ".row" child regardless of visual direction.
    while (feedEl.querySelectorAll(".row").length > cfg.max) {
      const oldest = feedEl.querySelector(".row");
      if (!oldest) break;
      removeRow(oldest);
    }
  }

  const EVENT_ICONS = { follow: "➕", sub: "⭐", resub: "⭐", giftsub: "🎁", raid: "🚀", cheer: "💎", redeem: "🎉" };

  function showBanner(kind, username, ev) {
    if (!cfg.showBanner) return;
    const [title, who, sub] = eventCopy(kind, username, ev);
    bTitleEl.textContent = `${EVENT_ICONS[kind] || "✨"} ${title}`;
    bBodyEl.textContent = who;
    bSubEl.textContent = sub;
    bannerEl.classList.add("show");
    clearTimeout(showBanner._t);
    showBanner._t = setTimeout(() => bannerEl.classList.remove("show"), cfg.bannerDuration);
  }

  function handleTwitchEvent(ev) {
    if (!cfg.showEvents) { if (cfg.showBanner) showBanner(ev.kind, ev.username || "?", ev); return; }
    if (cfg.theme === "bubbles") {
      addBubble(bubbleAlert(bubbleEventLine(ev.kind, ev.username || "?", ev)));
      showBanner(ev.kind, ev.username || "?", ev);
      return;
    }
    const [title, who, sub] = eventCopy(ev.kind, ev.username || "?", ev);
    addRow({
      username: who,
      color: "#ffd75e",
      text: sub ? `${title} — ${sub}` : title,
      isEvent: true,
      timestamp: Date.now(),
      iconLabel: EVENT_ICONS[ev.kind] || "✨",
    });
    showBanner(ev.kind, ev.username || "?", ev);
  }

  function handleChatMessage(msg) {
    if (msg.isBot && !cfg.showBotMessages) return;
    if (cfg.theme === "bubbles") {
      if (msg.isRedeem && !cfg.showRedeems) return;
      if (!msg.isRedeem && isIgnoredCommand(msg.text)) return;
      addBubble(bubbleMessage(msg));
      if (msg.isRedeem) showBanner("redeem", msg.username, { rewardTitle: msg.rewardTitle });
      return;
    }
    if (msg.isRedeem) {
      if (!cfg.showRedeems) return;
      if (cfg.showEvents) {
        addRow({
          username: msg.username,
          color: msg.color,
          text: msg.rewardTitle + (msg.text ? ` — "${msg.text}"` : ""),
          isEvent: true,
          timestamp: msg.timestamp,
          iconLabel: EVENT_ICONS.redeem,
        });
      }
      showBanner("redeem", msg.username, { rewardTitle: msg.rewardTitle });
      return;
    }
    addRow({
      username: msg.username,
      color: msg.color,
      text: msg.text,
      isEvent: false,
      timestamp: msg.timestamp,
    });
  }

  // ══ "bubbles" theme ═══════════════════════════════════════════════════════

    viewer: `<svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M0.14151 4.09941C0.14151 4.78649 0.251994 5.84354 1.24636 6.79488C2.13023 7.64052 4.99641 9.56656 5.16856 9.64891C5.27904 9.70177 5.38953 9.75462 5.50001 9.75462C5.61049 9.75462 5.72098 9.70177 5.83146 9.64891C5.97546 9.58003 8.86979 7.69338 9.75366 6.79488C10.748 5.84354 10.8585 4.78649 10.8585 4.09941C10.8585 2.51384 9.5327 1.24538 7.87543 1.24538C6.99155 1.24538 6.10768 1.72105 5.55525 2.46099C5.00283 1.72105 4.11895 1.24538 3.12459 1.24538C1.52257 1.24538 0.14151 2.51384 0.14151 4.09941Z" fill="var(--message-background)"/></svg>`,
  };

  // Lower number wins when a chatter holds several badges.
  const BADGE_PRIORITY = {
    broadcaster: 1, moderator: 2, vip: 3, "artist-badge": 4, founder: 5, subscriber: 6,
  };
  // IRC badge set-id -> icon key. Founder maps to the sub icon (a founder IS
  // an early subscriber); the original dropped them to the viewer icon by way
  // of a `case "subscriber" || "founder"` typo.
  const BADGE_ICON_KEY = {
    broadcaster: "broadcaster", moderator: "moderator", vip: "vip",
    "artist-badge": "artist", founder: "subscriber", subscriber: "subscriber",
  };

  function pickBadgeIcon(badges) {
    let best = null;
    for (const b of badges || []) {
      const p = BADGE_PRIORITY[b.type];
      if (p === undefined) continue;
      if (!best || p < BADGE_PRIORITY[best.type]) best = b;
    }
    return BADGE_ICONS[BADGE_ICON_KEY[best?.type]] || BADGE_ICONS.viewer;
  }

  function svgEl(markup) {
    const wrap = document.createElement("div");
    wrap.innerHTML = markup;
    return wrap.firstElementChild;
  }

  function decorated(className, markup) {
    const el = document.createElement("div");
    el.className = className;
    el.appendChild(svgEl(markup));
    return el;
  }

  // ── Message content: text + inline emotes ─────────────────────────────────
  const EMOJI_RE = /\p{Extended_Pictographic}/u;
  const EMOJI_SPLIT_RE = /(\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*)/gu;

  // Emoji get their own font stack — the Google Font the widget loads has no
  // emoji coverage, so without this they fall back inconsistently per-OS.
  function appendText(parent, str) {
    if (!str) return;
    const text = cfg.allCaps ? str.toUpperCase() : str;
    if (!EMOJI_RE.test(text)) {
      parent.appendChild(document.createTextNode(text));
      return;
    }
    for (const part of text.split(EMOJI_SPLIT_RE)) {
      if (!part) continue;
      if (EMOJI_RE.test(part)) {
        const span = document.createElement("span");
        span.style.fontFamily = "'Noto Color Emoji', serif";
        span.textContent = part;
        parent.appendChild(span);
      } else {
        parent.appendChild(document.createTextNode(part));
      }
    }
  }

  // `start`/`end` are inclusive CODE POINT indices (see backend/emotes.js), so
  // the text has to be walked as code points too — slicing the raw string
  // would misplace every emote that follows an astral character.
  function buildContent(text, emoteList, big) {
    const frag = document.createDocumentFragment();
    const chars = Array.from(text || "");
    const list = (emoteList || []).slice().sort((a, b) => a.start - b.start);
    let i = 0;
    for (const em of list) {
      if (em.start < i || em.end >= chars.length) continue; // overlapping or stale
      appendText(frag, chars.slice(i, em.start).join(""));
      const img = document.createElement("img");
      img.className = big ? "emote-big-size" : "emote-normal-size";
      img.src = em.urls?.[4] || em.urls?.[2] || em.urls?.[1] || "";
      img.alt = em.name;
      frag.appendChild(img);
      i = em.end + 1;
    }
    appendText(frag, chars.slice(i).join(""));
    return frag;
  }

  // True when the message is nothing but emotes — they then render at 38px,
  // the way Twitch and StreamElements both enlarge emote-only messages.
  function isEmoteOnly(text, emoteList) {
    if (!emoteList || !emoteList.length) return false;
    const chars = Array.from(text || "");
    const covered = new Array(chars.length).fill(false);
    for (const em of emoteList) {
      for (let k = em.start; k <= em.end && k < chars.length; k++) covered[k] = true;
    }
    return chars.every((c, k) => covered[k] || /\s/.test(c));
  }

  // ── Row builders ──────────────────────────────────────────────────────────
  function bubbleMessage(msg) {
    const box = document.createElement("div");
    box.className = "box message-box";
    if (msg.id) box.dataset.msgid = msg.id;
    if (msg.userId) box.dataset.userid = msg.userId;

    const content = document.createElement("div");
    content.className = "message-content-box";
    box.appendChild(content);

    // Header: bud ornament + username
    const header = document.createElement("section");
    header.className = "message-header";
    const userBox = document.createElement("div");
    userBox.className = "message-username-box";
    userBox.appendChild(decorated("badge-content", SVG.bud));
    const nameWrap = document.createElement("div");
    nameWrap.className = "username-box";
    const name = document.createElement("div");
    name.className = "username";
    name.textContent = msg.username || "";
    if (cfg.userColor && msg.color) name.style.color = msg.color;
    nameWrap.appendChild(name);
    userBox.appendChild(nameWrap);
    header.appendChild(userBox);
    content.appendChild(header);

    // Bubble
    const border = document.createElement("div");
    border.className = "content-box-border";
    const bubble = document.createElement("div");
    bubble.className = "content-box";

    const text = msg.isRedeem
      ? msg.rewardTitle + (msg.text ? ` — "${msg.text}"` : "")
      : msg.text || "";
    const emoteList = msg.isRedeem ? [] : msg.emotes;
    const big = !!msg.emoteOnly || isEmoteOnly(text, emoteList);

    const body = document.createElement("div");
    body.className = "content" + (big ? " emote-only" : "") + (msg.isAction ? " action" : "");
    body.appendChild(buildContent(text, emoteList, big));
    bubble.appendChild(body);
    bubble.appendChild(decorated("flower-inset-l", SVG.insetL));
    bubble.appendChild(decorated("flower-inset-r", SVG.insetR));
    border.appendChild(bubble);

    border.appendChild(decorated("flower-t-l", SVG.flowerTL));
    border.appendChild(decorated("flower-b-r", SVG.flowerBR));
    border.appendChild(decorated("vector-b", SVG.vectorB));
    border.appendChild(decorated("vector-t", SVG.vectorT));

    if (cfg.showBadges) {
      border.appendChild(decorated("badge-container", SVG.badgeTag));
      border.appendChild(decorated("badge-svg-icon", pickBadgeIcon(msg.badges)));
    }
    content.appendChild(border);
    return box;
  }

  function bubbleAlert(line) {
    const box = document.createElement("div");
    box.className = "box alert-box";
    const main = document.createElement("div");
    main.className = "alert-box-main";
    const contentBox = document.createElement("div");
    contentBox.className = "alert-content-box";
    const content = document.createElement("div");
    content.className = "alert-content";
    const title = document.createElement("div");
    title.className = "alert-title";
    const text = document.createElement("div");
    text.className = "alert-username";
    text.textContent = line;
    title.appendChild(text);
    content.appendChild(title);
    contentBox.appendChild(content);
    contentBox.appendChild(decorated("alert-svg-1", SVG.bud));
    contentBox.appendChild(decorated("alert-svg-2", SVG.bud));
    main.appendChild(contentBox);
    box.appendChild(main);
    return box;
  }

  // ── Scroll animation ──────────────────────────────────────────────────────
  // The original's trick, ported as-is: the incoming box starts with a large
  // negative bottom margin (so it sits underneath the feed) and animates to a
  // small positive one, pushing everything above it up and out of view.
  function animateBubbles() {
    const boxes = feedEl.querySelectorAll(".box");
    const first = boxes[0];
    if (!first) return;
    const firstIsAlert = first.classList.contains("alert-box");
    const second = boxes[1];
    const secondIsAlert = !!second && second.classList.contains("alert-box");

    const marginTop = parseFloat(getComputedStyle(first).marginTop) || 0;
    const offset = firstIsAlert ? 0 : 28;
    first.style.marginBottom = `-${first.scrollHeight + marginTop - offset}px`;

    setTimeout(() => {
      first.classList.add("box-transition");
      first.style.marginBottom = firstIsAlert ? "18px" : "37px";
      if (second) {
        if (secondIsAlert && !firstIsAlert) second.style.marginBottom = "20px";
        else if (!secondIsAlert && firstIsAlert) second.style.marginBottom = "28px";
      }
    }, 20);
  }

  // Newest first: the scroll animation always acts on the feed's first child,
  // and the CSS flips the visual order back with column-reverse.
  function addBubble(box) {
    feedEl.insertBefore(box, feedEl.firstChild);
    animateBubbles();
    trimFeed();
    if (cfg.fade > 0) {
      setTimeout(() => {
        box.classList.add("fade-out");
        setTimeout(() => box.remove(), 550);
      }, cfg.fade * 1000);
    }
  }

  // ── Alert copy ────────────────────────────────────────────────────────────
  const ALERT_TEMPLATES = {
    follow: "followAlertMessage",
    sub: "subAlertMessage",
    resub: "resubAlertMessage",
    giftsub: "giftedSubAlertMessage",
    cheer: "cheerAlertMessage",
    raid: "raidAlertMessage",
    redeem: "redeemAlertMessage",
  };

  function alertAmount(kind, ev) {
    if (kind === "resub") return ev.months;
    if (kind === "giftsub") return ev.count;
    if (kind === "cheer") return ev.bits;
    if (kind === "raid") return ev.viewers;
    if (kind === "redeem") return ev.rewardTitle;
    return "";
  }

  function bubbleEventLine(kind, username, ev) {
    const tpl = cfg[ALERT_TEMPLATES[kind]] || "";
    const amount = alertAmount(kind, ev);
    return `${username} ${tpl.replace(/\[amount\]/g, String(amount ?? ""))}`.trim();
  }

  // ── Config ────────────────────────────────────────────────────────────────
  let fontLinkEl = null;

  function loadGoogleFont(family) {
    // fontFamily is validated server-side (FONT_FAMILY_RE in
    // chatOverlayConfig.js), but re-encode here since it lands in a URL.
    const name = String(family || "").trim();
    if (!name) {
      if (fontLinkEl) { fontLinkEl.remove(); fontLinkEl = null; }
      return;
    }
    const href =
      "https://fonts.googleapis.com/css2?family=" +
      encodeURIComponent(name).replace(/%20/g, "+") +
      ":wght@100;200;300;400;500;600;700;800;900&display=swap";
    if (!fontLinkEl) {
      fontLinkEl = document.createElement("link");
      fontLinkEl.rel = "stylesheet";
      document.head.appendChild(fontLinkEl);
    }
    if (fontLinkEl.href !== href) fontLinkEl.href = href;
  }

  function applyBubbleConfig(prevTheme) {
    const on = cfg.theme === "bubbles";
    feedEl.classList.toggle("theme-bubbles", on);
    feedEl.classList.toggle("no-animate", on && !cfg.animate);
    feedEl.classList.toggle("no-decorations", on && !cfg.showDecorations);
    // The two themes render incompatible DOM (.row vs .box) and stack in
    // opposite orders, so a live theme switch starts from an empty feed
    // rather than trying to convert what's already on screen.
    if (prevTheme !== undefined && prevTheme !== cfg.theme) feedEl.replaceChildren();
    if (!on) return;

    loadGoogleFont(cfg.fontFamily);
    const root = document.documentElement.style;
    const family = cfg.fontFamily ? `'${String(cfg.fontFamily).replace(/'/g, "")}', sans-serif` : "sans-serif";
    root.setProperty("--font-family-primary", family);
    root.setProperty("--font-family-secondary", family);
    root.setProperty("--username-color", cfg.usernameColor);
    root.setProperty("--username-font-size", cfg.fontSizeUsername + "px");
    root.setProperty("--username-font-weight", String(cfg.fontWeightUsername));
    root.setProperty("--message-background", cfg.messageBackground);
    root.setProperty("--message-border", cfg.messageBorder);
    root.setProperty("--message-color", cfg.messageColor);
    root.setProperty("--message-font-size", cfg.fontSizeMessage + "px");
    root.setProperty("--message-font-weight", String(cfg.fontWeightMessage));
    root.setProperty("--flower-border", cfg.flowerBorder);
    root.setProperty("--flower-fill", cfg.flowerFill);
    root.setProperty("--flower-center", cfg.flowerCenter);
    root.setProperty("--flower-leaf", cfg.flowerLeaf);
    root.setProperty("--flower-2-leaf", cfg.flower2Leaf);
    root.setProperty("--flower-2-fill", cfg.flower2Fill);
    root.setProperty("--alert-username-color", cfg.alertColor);
    root.setProperty("--alert-username-font-size", cfg.fontSizeAlertUsername + "px");
    root.setProperty("--alert-username-font-weight", String(cfg.fontWeightAlertUsername));
  }

  // Hide messages that start with a configured command prefix (e.g. "!bot"),
  // so bot invocations don't clutter the overlay.
  function isIgnoredCommand(text) {
    const list = String(cfg.ignoreCommands || "")
      .split(",")
      .map((c) => c.trim().toLowerCase())
      .filter(Boolean);
    if (!list.length) return false;
    const first = String(text || "").trim().split(/\s+/)[0]?.toLowerCase();
    return !!first && list.includes(first);
  }

  // ── WebSocket ────────────────────────────────────────────────────────────
  function connect() {
    const wsProtocol = location.protocol === "https:" ? "wss://" : "ws://";
    const ws = new WebSocket(wsProtocol + location.host + "/chat?token=" + encodeURIComponent(token));
    ws.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch { return; }
      if (data.type === "chat") {
        handleChatMessage(data.msg);
      } else if (data.type === "twitch_event") {
        handleTwitchEvent(data.event);
      } else if (data.type === "chat_overlay_test_chat") {
        handleChatMessage(data.msg);
      } else if (data.type === "chat_overlay_test_event") {
        handleTwitchEvent(data.event);
      } else if (data.type === "chat_overlay_config") {
        applyConfig(data.config || {});
      } else if (data.type === "chat_overlay_bg_updated") {
        cfg.hasBgImage = !!data.hasBgImage;
        loadBgImage();
      }
    };
    ws.onclose = () => setTimeout(connect, 2000);
  }
  connect();
</script>
</body>
