<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Chat Overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100vw;
    height: 100vh;
    user-select: none;
    font-family: var(--font, "Segoe UI", system-ui, sans-serif);
  }

  /* The feed is a fixed, self-sized box anchored to one of nine positions by
     combining layout (column/row), vAlign and hAlign. Overflow is always
     hidden: the newest message enters from the anchored edge and the oldest
     is clipped at the far edge as the box reaches maxHeight. */
  #feed {
    position: fixed;
    width: var(--width, 420px);
    max-height: min(var(--maxheight, 600px), 96vh);
    display: flex;
    gap: var(--gap, 8px);
    overflow: hidden;
  }
  #feed.v-top { top: 1.2vh; bottom: auto; }
  #feed.v-center { top: 50%; bottom: auto; transform: translateY(-50%); }
  #feed.v-bottom { bottom: 1.2vh; top: auto; }
  #feed.h-left { left: 1.2vw; right: auto; }
  #feed.h-right { left: auto; right: 1.2vw; }

  #feed.layout-vertical { flex-direction: column; }
  #feed.layout-vertical.v-top { justify-content: flex-start; }
  #feed.layout-vertical.v-center { justify-content: center; }
  #feed.layout-vertical.v-bottom { justify-content: flex-end; }

  #feed.layout-horizontal { flex-direction: row; flex-wrap: nowrap; align-items: center; }
  #feed.layout-horizontal.h-left { justify-content: flex-start; }
  #feed.layout-horizontal.h-right { justify-content: flex-end; }

  /* Special modes alternate each message to the opposite edge. */
  #feed.layout-specialV .cg-msg:nth-child(even) { align-self: flex-end; }
  #feed.layout-specialV .cg-msg:nth-child(odd) { align-self: flex-start; }
  #feed.layout-specialH .cg-msg:nth-child(even) { align-self: flex-end; }
  #feed.layout-specialH .cg-msg:nth-child(odd) { align-self: flex-start; }

  /* Random positions: each message is placed absolutely by JS. */
  #feed.layout-random { display: block; height: min(var(--maxheight), 96vh); }
  #feed.layout-random .cg-msg { position: absolute; max-width: 90%; }

  .cg-msg {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    max-width: 100%;
    flex-shrink: 0;
    opacity: 0;
    animation-fill-mode: both;
    animation-duration: 0.35s;
  }
  .cg-msg.no-anim { opacity: 1; animation: none !important; }
  .cg-msg.leaving { opacity: 0; transition: opacity 0.4s ease; }
  .anim-slide { animation-name: cg-slide; }
  .anim-fade { animation-name: cg-fade; }
  .anim-pop { animation-name: cg-pop; }
  .anim-bounce { animation-name: cg-bounce; }
  .anim-zoom { animation-name: cg-zoom; }
  @keyframes cg-slide { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes cg-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes cg-pop { 0% { opacity: 0; transform: scale(0.6); } 70% { opacity: 1; transform: scale(1.06); } 100% { transform: scale(1); } }
  @keyframes cg-bounce { 0% { opacity: 0; transform: translateY(-24px); } 60% { opacity: 1; transform: translateY(6px); } 100% { transform: translateY(0); } }
  @keyframes cg-zoom { 0% { opacity: 0; transform: scale(1.4); } 100% { opacity: 1; transform: scale(1); } }

  .cg-name {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    max-width: 100%;
    line-height: 1.2;
  }
  .cg-name-inline { margin-right: 6px; }
  .cg-body {
    position: relative;
    max-width: 100%;
    line-height: 1.35;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .cg-name-text { font-weight: inherit; }
  .cg-name-text.caps { text-transform: uppercase; }
  .cg-colon { opacity: 0.85; }
  .cg-text.caps { text-transform: uppercase; }

  .cg-role-icon { display: block; width: auto; }
  .cg-badge { display: block; width: auto; image-rendering: auto; }
  .cg-tag {
    font-size: 0.72em;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .cg-time, .cg-pronoun { font-size: 0.72em; white-space: nowrap; }
  .cg-text img { vertical-align: middle; }
  .cg-text img.overlap { margin-left: -0.5em; }
  .cg-msg.action .cg-text { font-style: italic; }
  .cg-event { align-self: center; }
  .cg-event .cg-body { text-align: center; font-weight: 700; }
  .cg-event-icon { display: block; margin: 0 auto 2px; width: auto; }
</style>
</head>
<body>
  <div id="feed"></div>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get("token") || "";

  // All appearance/behavior comes from the server-side schema (see
  // backend/chatOverlaySchema.js), pushed live over the /chat WS as
  // { type: "chat_overlay_config" } — OBS never needs a reload.
  let cfg = {};
  const feedEl = document.getElementById("feed");

  // ── Small utilities ────────────────────────────────────────────────────────
  function hexToRgba(hex, alpha) {
    const s = String(hex || "#000").replace(/^#/, "");
    const full = s.length === 3 ? s.split("").map((c) => c + c).join("") : s;
    const n = parseInt(full.slice(0, 6), 16);
    if (!Number.isFinite(n)) return `rgba(0,0,0,${alpha})`;
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return `rgba(${r},${g},${b},${alpha})`;
  }

  // Google Font loader — one <link>, reused as the family changes.
  let fontLinkEl = null;
  function loadFont(family) {
    const name = String(family || "").trim();
    if (!name) { if (fontLinkEl) { fontLinkEl.remove(); fontLinkEl = null; } return; }
    const href = "https://fonts.googleapis.com/css2?family=" +
      encodeURIComponent(name).replace(/%20/g, "+") + ":wght@100;200;300;400;500;600;700;800;900&display=swap";
    if (!fontLinkEl) {
      fontLinkEl = document.createElement("link");
      fontLinkEl.rel = "stylesheet";
      document.head.appendChild(fontLinkEl);
    }
    if (fontLinkEl.href !== href) fontLinkEl.href = href;
  }

  // Sound cache keyed by URL, so a repeated alert reuses one decoded Audio.
  const audioCache = new Map();
  function playSound(url, volumePct) {
    const src = String(url || "").trim();
    if (!src) return;
    let audio = audioCache.get(src);
    if (!audio) { audio = new Audio(src); audioCache.set(src, audio); }
    audio.volume = Math.min(1, Math.max(0, Number(volumePct ?? 100) / 100));
    try { audio.currentTime = 0; } catch { /* not seekable yet */ }
    audio.play().catch(() => {});
  }

  // ── Config → global CSS variables + feed classes ───────────────────────────
  const LAYOUT_CLASSES = ["layout-vertical", "layout-horizontal", "layout-random", "layout-specialV", "layout-specialH"];
  const V_CLASSES = ["v-top", "v-center", "v-bottom"];
  const H_CLASSES = ["h-left", "h-right"];

  function applyConfig(newCfg) {
    cfg = { ...cfg, ...newCfg };
    const root = document.documentElement.style;
    root.setProperty("--width", cfg.width + "px");
    root.setProperty("--maxheight", cfg.maxHeight + "px");
    root.setProperty("--gap", cfg.gap + "px");
    root.setProperty("--font", cfg.font ? `'${String(cfg.font).replace(/'/g, "")}', sans-serif` : "");
    loadFont(cfg.font);

    feedEl.classList.remove(...LAYOUT_CLASSES, ...V_CLASSES, ...H_CLASSES);
    feedEl.classList.add("layout-" + cfg.layout);
    feedEl.classList.add("v-" + cfg.vAlign);
    feedEl.classList.add("h-" + cfg.hAlign);

    trim();
  }

  async function loadConfig() {
    try {
      const res = await fetch("/chat-overlay/config?token=" + encodeURIComponent(token));
      const data = await res.json();
      applyConfig(data.config || {});
    } catch {
      applyConfig({ layout: "vertical", vAlign: "bottom", hAlign: "left", width: 420, maxHeight: 600, gap: 8, max: 25, animate: true });
    }
  }
  loadConfig();

  // ── Role resolution + effective styling ────────────────────────────────────
  const ROLE_IDS = ["streamer", "mod", "vip", "sub1", "sub2", "sub3", "normal", "custom1", "custom2", "custom3"];

  function roleEnabled(id) { return cfg[`role_${id}_enable`] !== false; }

  function roleForMessage(msg) {
    const badges = msg.badges || [];
    for (const b of badges) {
      if (b.type === "broadcaster") return "streamer";
      if (b.type === "moderator") return "mod";
      if (b.type === "vip") return "vip";
    }
    const sub = badges.find((b) => b.type === "subscriber" || b.type === "founder");
    if (sub) {
      const v = parseInt(sub.version, 10) || 0;
      if (v >= 3000) return "sub3";
      if (v >= 2000) return "sub2";
      return "sub1";
    }
    const name = String(msg.username || "").toLowerCase();
    for (const id of ["custom1", "custom2", "custom3"]) {
      if (!cfg[`role_${id}_enable`]) continue;
      const words = String(cfg[`role_${id}_match`] || "").toLowerCase().split(",").map((s) => s.trim()).filter(Boolean);
      if (words.some((w) => name === w || name.includes(w))) return id;
    }
    return "normal";
  }

  // Collapses the role-specific overrides into the flat values a message
  // needs, falling back to the global Name box / Message box settings. A
  // disabled role falls back to "normal", then to the globals.
  // Deliberately free of per-message data (the chatter's Twitch color is
  // applied at render time in buildName) so the result can be cached per role
  // without freezing the first chatter's color onto everyone.
  function styleFor(roleId) {
    const pick = (id) => (roleEnabled(id) ? id : "normal");
    const r = pick(roleId);
    const val = (key) => cfg[`role_${r}_${key}`];
    return {
      nameColor: val("nameColor") || cfg.nameColor,
      msgColor: val("msgColor") || cfg.msgColor,
      nameBg: val("nameBg") || cfg.nameBgColor,
      msgBg: val("msgBg") || cfg.msgBgColor,
      border: val("border") || cfg.msgBorderColor,
      tag: val("tag") || "",
      tagColor: val("tagColor"),
      tagBg: val("tagBg"),
      icon: val("icon") || "",
      iconSize: val("iconSize"),
      animation: val("animation") || "none",
      sound: val("sound") || "",
      soundVolume: val("soundVolume"),
    };
  }

  // Inline style objects are the same for every message of a role until the
  // config changes, so they're cached and invalidated wholesale on apply.
  let styleCache = new Map();
  function resetCaches() { styleCache = new Map(); }

  // ── Message rendering ──────────────────────────────────────────────────────
  const EMOJI_RE = /\p{Extended_Pictographic}/u;
  const EMOJI_SPLIT_RE = /(\p{Extended_Pictographic}(?:️|‍\p{Extended_Pictographic})*)/gu;

  function appendText(parent, str, caps) {
    if (!str) return;
    const text = caps ? str.toUpperCase() : str;
    if (!EMOJI_RE.test(text)) { parent.appendChild(document.createTextNode(text)); return; }
    for (const part of text.split(EMOJI_SPLIT_RE)) {
      if (!part) continue;
      if (EMOJI_RE.test(part)) {
        const span = document.createElement("span");
        span.style.fontFamily = "'Noto Color Emoji', serif";
        span.textContent = part;
        parent.appendChild(span);
      } else {
        parent.appendChild(document.createTextNode(part));
      }
    }
  }

  // Emote positions are inclusive CODE POINT indices (see backend/emotes.js),
  // so the text is walked as code points too — slicing the raw string would
  // misplace anything after an astral character.
  function buildContent(text, emoteList, big, caps) {
    const frag = document.createDocumentFragment();
    const chars = Array.from(text || "");
    const list = (emoteList || []).slice().sort((a, b) => a.start - b.start);
    let i = 0;
    for (const em of list) {
      if (em.start < i || em.end >= chars.length) continue;
      appendText(frag, chars.slice(i, em.start).join(""), caps);
      const img = document.createElement("img");
      img.src = em.urls?.[4] || em.urls?.[2] || em.urls?.[1] || "";
      img.alt = em.name;
      img.style.height = (big ? cfg.bigEmoteSize : cfg.emoteSize) + "px";
      img.style.verticalAlign = cfg.emoteAlign === "top" ? "top" : cfg.emoteAlign === "bottom" ? "bottom" : "middle";
      if (cfg.emoteOverlap) img.classList.add("overlap");
      frag.appendChild(img);
      i = em.end + 1;
    }
    appendText(frag, chars.slice(i).join(""), caps);
    return frag;
  }

  function isEmoteOnly(text, emoteList) {
    if (!emoteList || !emoteList.length) return false;
    const chars = Array.from(text || "");
    const covered = new Array(chars.length).fill(false);
    for (const em of emoteList) for (let k = em.start; k <= em.end && k < chars.length; k++) covered[k] = true;
    return chars.every((c, k) => covered[k] || /\s/.test(c));
  }

  function fmtTime(ts) {
    const d = new Date(ts || Date.now());
    return d.toLocaleTimeString(cfg.lang === "es" ? "es-ES" : "en-US", {
      hour: "2-digit", minute: "2-digit", hour12: !cfg.timestamp24h,
    });
  }

  // ── Pronouns (pronouns.alejo.io), cached per login ─────────────────────────
  const pronounCache = new Map();
  let pronounMap = null;
  function loadPronounMap() {
    if (pronounMap) return Promise.resolve(pronounMap);
    return fetch("https://pronouns.alejo.io/api/pronouns")
      .then((r) => r.json())
      .then((list) => {
        pronounMap = {};
        for (const p of list || []) pronounMap[p.name] = p.display;
        return pronounMap;
      })
      .catch(() => (pronounMap = {}));
  }
  function fillPronoun(el, login) {
    if (!login) return;
    if (pronounCache.has(login)) { el.textContent = pronounCache.get(login); return; }
    pronounCache.set(login, "");
    loadPronounMap()
      .then(() => fetch("https://pronouns.alejo.io/api/users/" + encodeURIComponent(login)))
      .then((r) => r.json())
      .then((users) => {
        const id = Array.isArray(users) && users[0] && users[0].pronoun_id;
        const display = (pronounMap && pronounMap[id]) || id || "";
        pronounCache.set(login, display);
        if (display && el.isConnected) el.textContent = display;
      })
      .catch(() => {});
  }

  function badgeImgs(msg) {
    const badges = (msg.badges || []).filter((b) => b.url).slice(0, 3);
    return badges.map((b) => {
      const img = document.createElement("img");
      img.className = "cg-badge";
      img.src = b.url;
      img.alt = b.description || b.type || "";
      img.style.height = cfg.badgeSize + "px";
      return img;
    });
  }

  function buildMessageBody(msg, style, big, isEvent) {
    const body = document.createElement("div");
    body.className = "cg-body";
    body.style.background = hexToRgba(style.msgBg, cfg.msgBgOpacity);
    body.style.color = style.msgColor;
    body.style.fontSize = cfg.msgSize + "px";
    body.style.fontWeight = String(cfg.msgWeight);
    body.style.textAlign = isEvent ? "center" : cfg.msgAlign;
    body.style.border = cfg.msgBorderWidth > 0 ? `${cfg.msgBorderWidth}px solid ${style.border}` : "none";
    body.style.borderRadius = cfg.msgRadius + "px";
    body.style.padding = `${cfg.msgPadY}px ${cfg.msgPadX}px`;
    body.style.transform = cfg.msgTilt ? `rotate(${cfg.msgTilt}deg)` : "";
    body.style.boxShadow = cfg.msgShadow ? "0 2px 8px rgba(0,0,0,0.4)" : "none";
    if (cfg.msgMaxWidth > 0) body.style.maxWidth = cfg.msgMaxWidth + "px";
    return body;
  }

  function buildName(msg, style) {
    const name = document.createElement("div");
    name.className = "cg-name";
    name.style.background = hexToRgba(style.nameBg, cfg.nameBgOpacity);
    name.style.border = cfg.nameBorderWidth > 0 ? `${cfg.nameBorderWidth}px solid ${style.border}` : "none";
    name.style.borderRadius = cfg.nameRadius + "px";
    name.style.padding = `${cfg.namePadY}px ${cfg.namePadX}px`;
    name.style.transform = cfg.nameTilt ? `rotate(${cfg.nameTilt}deg)` : "";

    if (style.icon) {
      const icon = document.createElement("img");
      icon.className = "cg-role-icon";
      icon.src = style.icon;
      icon.alt = "";
      icon.style.height = (style.iconSize || 22) + "px";
      name.appendChild(icon);
    }
    if (cfg.showBadges) for (const img of badgeImgs(msg)) name.appendChild(img);

    const nameText = document.createElement("span");
    nameText.className = "cg-name-text" + (cfg.nameCaps ? " caps" : "");
    nameText.textContent = msg.username || "";
    nameText.style.color = (cfg.userColor && msg.color) ? msg.color : style.nameColor;
    nameText.style.fontSize = cfg.nameSize + "px";
    nameText.style.fontWeight = String(cfg.nameWeight);
    nameText.style.textShadow = cfg.nameShadow ? "0 1px 3px rgba(0,0,0,0.75)" : "none";
    name.appendChild(nameText);

    if (cfg.nameColon) {
      const colon = document.createElement("span");
      colon.className = "cg-colon";
      colon.textContent = ":";
      name.appendChild(colon);
    }

    if (style.tag) {
      const tag = document.createElement("span");
      tag.className = "cg-tag";
      tag.textContent = style.tag;
      tag.style.color = style.tagColor;
      tag.style.background = hexToRgba(style.tagBg, 1);
      name.appendChild(tag);
    }
    if (cfg.showPronouns && msg.login) {
      const pr = document.createElement("span");
      pr.className = "cg-pronoun";
      pr.style.color = cfg.pronounColor;
      name.appendChild(pr);
      fillPronoun(pr, msg.login);
    }
    if (cfg.showTimestamps) {
      const time = document.createElement("span");
      time.className = "cg-time";
      time.style.color = cfg.timestampColor;
      time.textContent = fmtTime(msg.timestamp);
      name.appendChild(time);
    }
    return name;
  }

  const ANIM_NAMES = new Set(["slide", "fade", "pop", "bounce", "zoom"]);

  function attach(node, animation, sound, soundVolume) {
    if (cfg.animate && ANIM_NAMES.has(animation)) node.classList.add("anim-" + animation);
    else node.classList.add("no-anim");
    if (sound) playSound(sound, soundVolume);
  }

  // Picks the DOM edge a new node enters from, so the newest message stays
  // visible while the oldest is clipped: appending suits a container justified
  // toward its end, prepending suits one justified toward its start.
  function place(node) {
    const prepend = cfg.layout === "horizontal" && cfg.hAlign === "left";
    if (prepend) feedEl.insertBefore(node, feedEl.firstChild);
    else feedEl.appendChild(node);
    if (cfg.layout === "random") randomize(node);
  }

  function randomize(node) {
    // Placed after insertion so the node has a measured size for the bounds.
    requestAnimationFrame(() => {
      const fw = feedEl.clientWidth, fh = feedEl.clientHeight;
      const w = node.offsetWidth, h = node.offsetHeight;
      node.style.left = Math.max(0, Math.random() * Math.max(0, fw - w)) + "px";
      node.style.top = Math.max(0, Math.random() * Math.max(0, fh - h)) + "px";
    });
  }

  function scheduleRemoval(node) {
    if (cfg.hideAfter > 0) {
      setTimeout(() => {
        node.classList.add("leaving");
        setTimeout(() => node.remove(), 450);
      }, cfg.hideAfter * 1000);
    }
  }

  function renderMessage(msg, isEvent) {
    const roleId = isEvent ? "normal" : roleForMessage(msg);
    let style = styleCache.get(roleId);
    if (!style) { style = styleFor(roleId); styleCache.set(roleId, style); }

    const node = document.createElement("div");
    node.className = "cg-msg" + (msg.isAction ? " action" : "") + (isEvent ? " cg-event" : "");
    if (msg.id) node.dataset.id = msg.id;

    const text = msg.isRedeem ? (msg.rewardTitle || "") + (msg.text ? ` — "${msg.text}"` : "") : (msg.text || "");
    const emoteList = msg.isRedeem ? [] : msg.emotes;
    const big = !isEvent && isEmoteOnly(text, emoteList);
    const caps = !!(cfg.allCaps || cfg.msgCaps);

    const body = buildMessageBody(msg, style, big, isEvent);
    const span = document.createElement("span");
    span.className = "cg-text" + (caps ? " caps" : "");
    span.appendChild(buildContent(text, emoteList, big, caps));
    body.appendChild(span);

    if (!isEvent && cfg.nameInside) {
      const name = buildName(msg, style);
      name.classList.add("cg-name-inline");
      name.style.display = "inline-flex";
      body.insertBefore(name, span);
    }

    if (!isEvent && !cfg.nameInside) node.appendChild(buildName(msg, style));
    node.appendChild(body);
    attach(node, style.animation, style.sound, style.soundVolume);
    place(node);
    trim();
    scheduleRemoval(node);
  }

  function renderEvent(kind, ev) {
    const key = "event_" + kind + "_";
    if (cfg[key + "enable"] === false) return;
    const min = Number(cfg[key + "min"] || 0);
    const amount = eventAmount(kind, ev);
    if (amount !== "" && Number(amount) < min) return;

    const node = document.createElement("div");
    node.className = "cg-msg cg-event";

    if (cfg[key + "icon"]) {
      const icon = document.createElement("img");
      icon.className = "cg-event-icon";
      icon.src = cfg[key + "icon"];
      icon.alt = "";
      icon.style.height = "34px";
      node.appendChild(icon);
    }

    const style = {
      msgBg: cfg[key + "bg"] || "#9147ff",
      msgColor: cfg[key + "color"] || "#ffd75e",
      border: cfg[key + "bg"] || "#9147ff",
    };
    const body = buildMessageBody({}, style, false, true);
    const span = document.createElement("span");
    span.className = "cg-text";
    span.textContent = fillTemplate(cfg[key + "message"] || "{name}", ev, amount);
    body.appendChild(span);
    node.appendChild(body);

    attach(node, cfg[key + "animation"], cfg[key + "sound"], cfg[key + "soundVolume"]);
    place(node);
    trim();
    scheduleRemoval(node);
  }

  function fillTemplate(tpl, ev, amount) {
    return String(tpl)
      .replace(/\{name\}/gi, ev.username || ev.name || "")
      .replace(/\{sender\}/gi, ev.sender || ev.username || "")
      .replace(/\{amount\}/gi, amount === "" ? "" : String(amount));
  }

  function eventAmount(kind, ev) {
    switch (kind) {
      case "giftsub": return ev.count ?? "";
      case "raid": return ev.viewers ?? "";
      case "bits": return ev.bits ?? "";
      case "tips": return ev.amount ?? "";
      case "sub": return ev.months ?? "";
      default: return "";
    }
  }

  // Twitch event kinds (from sessions/EventSub) → schema event ids.
  const EVENT_KIND = {
    follow: "follow", sub: "sub", resub: "sub", giftsub: "giftsub",
    raid: "raid", cheer: "bits", tips: "tips",
  };

  function handleTwitchEvent(ev) {
    if (ev.kind === "redeem") return;
    if (!cfg.showEvents) return;
    const kind = EVENT_KIND[ev.kind];
    if (kind) renderEvent(kind, ev);
  }

  function isMuted(msg) {
    const list = String(cfg.mutedUsers || "").toLowerCase().split(",").map((s) => s.trim()).filter(Boolean);
    return list.includes(String(msg.username || "").toLowerCase().trim());
  }

  function isCommand(text) {
    return String(text || "").trim().startsWith("!");
  }

  function handleChatMessage(msg) {
    if (msg.isBot && !cfg.showBotMessages) return;
    if (isMuted(msg)) return;
    if (!msg.isRedeem && (cfg.hideCommands && isCommand(msg.text))) return;
    if (msg.isRedeem && !cfg.showRedeems) return;
    const delay = Math.max(0, Number(cfg.showDelay) || 0);
    if (delay > 0) setTimeout(() => renderMessage(msg, false), delay * 1000);
    else renderMessage(msg, false);
  }

  function trim() {
    const nodes = feedEl.querySelectorAll(".cg-msg");
    for (let i = 0; i < nodes.length - cfg.max; i++) nodes[i].remove();
  }

  // ── WebSocket ──────────────────────────────────────────────────────────────
  function connect() {
    const proto = location.protocol === "https:" ? "wss://" : "ws://";
    const ws = new WebSocket(proto + location.host + "/chat?token=" + encodeURIComponent(token));
    ws.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch { return; }
      if (data.type === "chat" || data.type === "chat_overlay_test_chat") {
        handleChatMessage(data.msg);
      } else if (data.type === "twitch_event" || data.type === "chat_overlay_test_event") {
        handleTwitchEvent(data.event);
      } else if (data.type === "chat_overlay_config") {
        resetCaches();
        applyConfig(data.config || {});
      }
    };
    ws.onclose = () => setTimeout(connect, 2000);
  }
  connect();
</script>
</body>
</html>
