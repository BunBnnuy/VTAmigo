<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Served from public/ rather than src/img/ so the URL stays stable —
         Vite content-hashes anything imported from src/, which breaks both
         the browser's automatic /favicon.ico request and social scrapers. -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&family=Instrument+Serif&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>VTAmigo — Co-presentador con IA para Twitch</title>
    <meta name="description" content="VTAmigo lee tu chat de Twitch, responde en voz alta y anima el avatar en OBS. Tu stream tiene con quién hablar, incluso cuando el chat está tranquilo." />
    <link rel="canonical" href="https://vtamigo.top/" />

    <!-- Social share cards. Absolute URLs are required by scrapers and there
         is no build-time origin var in this project, so the canonical host is
         hardcoded. Keep in sync with CANONICAL_HOST in backend/index.js. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VTAmigo" />
    <meta property="og:url" content="https://vtamigo.top/" />
    <meta property="og:title" content="VTAmigo — Tu chat de Twitch tiene con quién hablar" />
    <meta property="og:description" content="Lee el chat, responde en voz alta y anima el avatar en OBS. Gratis para probar, sin tarjeta." />
    <meta property="og:image" content="https://vtamigo.top/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="La mascota de VTAmigo junto al lema: tu chat de Twitch tiene con quién hablar." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VTAmigo — Tu chat de Twitch tiene con quién hablar" />
    <meta name="twitter:description" content="Lee el chat, responde en voz alta y anima el avatar en OBS. Gratis para probar, sin tarjeta." />
    <meta name="twitter:image" content="https://vtamigo.top/og-image.png" />
    <meta name="twitter:image:alt" content="La mascota de VTAmigo junto al lema: tu chat de Twitch tiene con quién hablar." />
    <script defer src="https://cloud.umami.is/script.js" data-website-id="21bc6984-b18f-4228-935f-d5b20daf9dae"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
